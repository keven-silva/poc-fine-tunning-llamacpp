# Single source of truth for every hyperparameter and path.
# Scripts must never hardcode a value that lives here.

model:
  base_id: unsloth/Qwen3-8B
  # Weights loaded for training only (ADR 0014). base_id resolves to Unsloth's dynamic
  # 4-bit checkpoint (6.97GB), which does not even load in 8GB; the standard bnb 4-bit
  # one is 5.66GB. Tokenizer and the fp16 base export still come from base_id.
  train_id: unsloth/Qwen3-8B-bnb-4bit
  # Longest training text measured is 1458 tokens; 2048 only reserved VRAM.
  max_seq_length: 1536
  load_in_4bit: true

data:
  hf_dataset: nvidia/Nemotron-Personas-Brazil
  n_train: 10000  # ADR 0012; ~25 s/step measured on the 3070 Ti -> ~4.4h
  n_val: 500
  n_test: 200
  seed: 3407
  max_name_drop_rate: 0.05

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  random_state: 3407

train:
  # Effective batch 16, one sequence at a time: measured 7.06GB peak on the 8GB card.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  # Sort similar-length sequences into the same batch. Targets range 775-1458 tokens,
  # so without this a short sequence is padded up to the longest in its batch.
  group_by_length: true
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 10
  # "no" on the 8GB card: an eval pass materialises full logits (vocab 151936) in fp32
  # and OOMs a GPU that trains fine (ADR 0014). Set to "steps" on a card with >=12GB.
  eval_strategy: "no"
  eval_steps: 100
  # Validation is 500 rows, but a full pass costs ~12 min of wall clock and runs 6 times
  # -- 75 minutes on a 6.8h run, for a loss estimate that is already stable well before
  # then. Subsample it; val.jsonl stays complete on disk.
  eval_subset_rows: 150
  save_steps: 250
  save_total_limit: 3
  seed: 3407

decode:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repeat_penalty: 1.05
  n_predict: 1024
  seed: 3407

llamacpp:
  # Read by scripts/00_setup_llamacpp.sh (an exported LLAMA_COMMIT overrides it).
  commit: "bdeb855b30dfe7f6e695cba98445a7ba09e6416e"

paths:
  data_dir: data
  outputs_dir: outputs
  llamacpp_dir: vendor/llama.cpp
