[project]
name = "personas"
version = "0.1.0"
description = "Qwen3-8B QLoRA fine-tune on Brazilian persona data, evaluated through llama.cpp"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
train = [
    "torch==2.11.0",
    "torchvision",
    "unsloth",
    "unsloth-zoo",
    "trl",
    "peft",
    "transformers",
    "datasets",
    "bitsandbytes",
    "accelerate",
    "huggingface-hub>=0.34.0",
    "pyarrow>=17.0.0",
]
eval = ["langchain-core==0.3.75", "httpx==0.28.1"]
dev = [
    "pytest>=8.3.0",
    # Build tooling for llama.cpp, installed into the venv so the project needs no
    # system packages beyond a C++ compiler; the HIP toolchain comes from vendor/rocm.
    "cmake>=3.28",
    "ninja>=1.11",
]


# torch rocm7.1 wheels. The wheel's bundled HIP runtime MUST match the host ROCm
# (7.1.1 in /opt/rocm-7.1.1): the rocm7.14 wheel segfaults in libamdhip64 at the first
# kernel launch on this host while torch.cuda.is_available() still returns True. This is
# the opposite of CUDA's backward-compatibility rule in ADR 0011 (see ADR 0015).
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"

[tool.uv]
# triton JIT-compiles a C module at the first training step and needs Python.h. A distro
# Python without its -dev package lacks it; uv's managed builds ship the headers.
python-preference = "only-managed"
environments = ["sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# torchvision MUST come from the same index as torch: transformers imports it, and a build against a different ROCm release aborts the import.
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: requires downloading the tokenizer"]
